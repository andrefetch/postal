name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
      XDG_CONFIG_HOME: ${{ runner.temp }}/postal-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Cache tokenizer data
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run Python tests
        run: python -m pytest tests -q

  terminal:
    name: TypeScript terminal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/terminal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail if the committed bundle is stale
        run: test -z "$(git status --porcelain ui/terminal_bundle)"
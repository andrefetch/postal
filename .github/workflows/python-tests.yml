name: Python tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
      XDG_CONFIG_HOME: ${{ runner.temp }}/postal-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Cache tokenizer data
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run Python tests
        run: python -m pytest tests -q
